# Aira app CI. Runs with no secrets configured -- the app is designed to degrade to
# on-device mocks when EXPO_PUBLIC_* keys are absent, so a green run here proves nothing
# depends on a key being present.
#
# Lint is intentionally NOT included: `expo lint` (ESLint + eslint-config-expo) surfaces
# 17 real react-hooks/refs errors against current main (refs read during render in
# Waveform.tsx, mascotMoods.tsx, and the session screen). Fixing those is an application
# behaviour change, out of scope for a CI-only PR -- see the PR description.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Web build
        run: npx expo export --platform web

      - name: Every exported page is noindex (invite-only beta preview)
        run: |
          html_files=$(find dist -name '*.html')
          if [ -z "$html_files" ]; then
            echo "no HTML files found in dist/ — web export produced nothing to check" >&2
            exit 1
          fi
          for f in $html_files; do
            if ! grep -q '<meta name="robots" content="noindex, nofollow"' "$f"; then
              echo "missing noindex robots meta: $f" >&2
              exit 1
            fi
          done

      - name: Interface fonts ship, and no font asset path crosses node_modules
        run: |
          # Cloudflare Pages' deploy uploader silently drops any dist/assets/** file whose path
          # contains a node_modules segment (confirmed live: the request 200s with the SPA-fallback
          # index.html instead of the real asset, so document.fonts reports the face `error` and
          # interface text renders in the system fallback). Metro names an asset's exported path
          # after its source module's path relative to the project root, so requiring a font
          # straight from an npm package (as @expo-google-fonts/lexend used to be) reintroduces
          # exactly that path shape. This guards both ends: the four Lexend weights the type ramp
          # needs are present under assets/fonts (vendored locally, not required from node_modules),
          # and no dist/assets font ships under a node_modules path at all.
          missing=0
          for weight in 400Regular 500Medium 600SemiBold 700Bold; do
            if ! find dist/assets -path '*/assets/fonts/*' -iname "Lexend_${weight}.*.ttf" | grep -q .; then
              echo "missing exported Lexend_${weight} under dist/assets/**/assets/fonts/" >&2
              missing=1
            fi
          done
          bad_paths=$(find dist/assets -path '*node_modules*' \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff*' \))
          if [ -n "$bad_paths" ]; then
            echo "font asset(s) exported under a node_modules path — Cloudflare Pages will drop these:" >&2
            echo "$bad_paths" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
